name: RAM verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: RAM platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash -n ram-altman.sh test-ram-altman.sh
      - run: bash test-ram-altman.sh
      - run: node --test .github/scripts/ai-review.test.cjs
  required:
    name: RAM verify
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLATFORM_RESULT: ${{ needs.verify.result }}
        run: test "$PLATFORM_RESULT" = success
